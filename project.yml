# XcodeGen spec. Esputifai.xcodeproj and App/Info.plist are generated from it
# (scripts/gen-xcodeproj.sh) and committed, so the Mac only needs Xcode. Edit this file, not those.
name: Esputifai
options:
  bundleIdPrefix: dev.personal
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  EsputifaiCore:
    path: Core
settings:
  base:
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "5.0"
    # Signing: pick your team (a free Apple ID works) in Xcode > Signing & Capabilities.
    # If Xcode says the bundle id is taken, change it here (it must be unique per Apple ID).
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  Esputifai:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Resources
    dependencies:
      - package: EsputifaiCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.personal.esputifai
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: App/Info.plist # generated
      properties:
        CFBundleDisplayName: Esputifai
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        # Music keeps playing with the screen off or the app in the background.
        UIBackgroundModes: [audio]
        # Voice search (VoiceSearch.swift): iOS shows these texts when it asks for permission.
        NSMicrophoneUsageDescription: Para buscar música diciéndola en voz alta.
        NSSpeechRecognitionUsageDescription: Para convertir en texto lo que dices al buscar por voz.
        # Shared playlists: the page of the link opens esputifai://import?d=<data>.
        CFBundleURLTypes:
          - CFBundleURLName: dev.personal.esputifai.import
            CFBundleURLSchemes: [esputifai]
